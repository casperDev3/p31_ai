<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Doodle Jump</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f3f1e9;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            background-image: linear-gradient(#e5e1d3 1px, transparent 1px), linear-gradient(90deg, #e5e1d3 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 3px dashed #bba;
            pointer-events: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 80%;
            max-height: 90%;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .screen.active {
            display: flex;
        }
        h1 {
            color: #8cc63f;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ccc;
        }
        button {
            background-color: #8cc63f;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            font-family: inherit;
            box-shadow: 0 5px 0 #6aa32a;
            transition: transform 0.1s, box-shadow 0.1s;
            width: 100%;
            max-width: 200px;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        #scoreBoard {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            pointer-events: none;
            background: rgba(255,255,255,0.7);
            padding: 5px 10px;
            border-radius: 10px;
        }
        #pauseBtnUI {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            background: rgba(255,255,255,0.7);
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 5px 15px;
            cursor: pointer;
            pointer-events: auto;
            font-weight: bold;
        }
        .controls-hint {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
            line-height: 1.5;
        }
        .leaderboard {
            text-align: left;
            margin-bottom: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="scoreBoard" style="display: none;">Score: <span id="currentScore">0</span></div>
    <button id="pauseBtnUI" style="display: none;">⏸</button>

    <div id="ui">
        <div id="menuScreen" class="screen active">
            <h1>Doodle Jump</h1>
            <h3>Top 5</h3>
            <div id="menuHighScore" class="leaderboard"></div>
            <button id="playBtn">Play</button>
            <div class="controls-hint">Desktop: Left/Right Arrows or A/D<br>Mobile: Tap Left/Right halves of screen<br>Pause: P key or Top-Right Button</div>
        </div>

        <div id="gameOverScreen" class="screen">
            <h1>Game Over</h1>
            <p style="font-size: 24px; margin: 10px 0;">Score: <span id="finalScore">0</span></p>
            <h3>Top 5</h3>
            <div id="endHighScore" class="leaderboard"></div>
            <button id="retryBtn">Retry</button>
            <button id="menuBtn">Menu</button>
        </div>

        <div id="pauseScreen" class="screen">
            <h1>Paused</h1>
            <button id="resumeBtn">Resume</button>
            <button id="quitBtn">Quit to Menu</button>
        </div>
    </div>
</div>

<script>
    // roundRect polyfill for pre-Safari-16
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y,     x + w, y + h, r);
        this.arcTo(x + w, y + h, x,     y + h, r);
        this.arcTo(x,     y + h, x,     y,     r);
        this.arcTo(x,     y,     x + w, y,     r);
        this.closePath();
        return this;
      };
    }

    // Platform type constants
    const PLAT_TYPES = { NORMAL: 0, MOVING: 1, BREAKABLE: 2, SPRING: 3, DISAPPEAR: 4 };

    // Game Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('gameContainer');

    let CANVAS_WIDTH = gameContainer.clientWidth;
    let CANVAS_HEIGHT = gameContainer.clientHeight;
    let prevCanvasWidth = CANVAS_WIDTH;

    function resizeCanvas() {
        const oldW = prevCanvasWidth;
        CANVAS_WIDTH = gameContainer.clientWidth;
        CANVAS_HEIGHT = gameContainer.clientHeight;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;
        // Rescale world X coordinates so an in-progress run survives resize
        if (gameState === 'playing' && oldW && oldW !== CANVAS_WIDTH) {
            const ratio = CANVAS_WIDTH / oldW;
            if (player) player.x *= ratio;
            for (const p of platforms) p.x *= ratio;
            for (const e of enemies)   e.x *= ratio;
            for (const it of items)    it.x *= ratio;
        }
        prevCanvasWidth = CANVAS_WIDTH;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Constants
    const GRAVITY = 0.4;
    const JUMP_VELOCITY = -10;
    const SUPER_JUMP_VELOCITY = -18;
    const PLAYER_SPEED = 6;
    
    // UI Elements
    const menuScreen = document.getElementById('menuScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const pauseScreen = document.getElementById('pauseScreen');
    const scoreBoard = document.getElementById('scoreBoard');
    const pauseBtnUI = document.getElementById('pauseBtnUI');
    const currentScoreEl = document.getElementById('currentScore');
    const finalScoreEl = document.getElementById('finalScore');
    const menuHighScoreEl = document.getElementById('menuHighScore');
    const endHighScoreEl = document.getElementById('endHighScore');

    // State Variables
    let gameState = 'menu'; // menu, playing, gameover
    let isPaused = false;
    let score = 0;
    
    let leaderBoard;
    try {
        leaderBoard = JSON.parse(localStorage.getItem('doodle_leaderboard')) || [];
        if (!Array.isArray(leaderBoard)) leaderBoard = [];
    } catch {
        leaderBoard = [];
    }
    function renderLeaderboard() {
        const html = leaderBoard.length
            ? leaderBoard.map((s,i) => `<div>${i+1}. ${s}</div>`).join('')
            : `<div style="color:#888">No scores yet</div>`;
        menuHighScoreEl.innerHTML = html;
        endHighScoreEl.innerHTML = html;
    }
    renderLeaderboard();

    let cameraY = 0;
    let shakeTime = 0;
    let platforms = [];
    let enemies = [];
    let items = [];
    let particles = [];
    let player;
    let animationId;
    let highestY = 0;

    // Input Handling
    const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };
    let touchLeft = false;
    let touchRight = false;
    const activeTouches = new Map(); // touch.identifier → 'left' | 'right'

    window.addEventListener('keydown', (e) => {
        if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
        if(e.key.toLowerCase() === 'p') togglePause();
    });
    window.addEventListener('keyup', (e) => {
        if(keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    function syncTouchSides() {
        const sides = [...activeTouches.values()];
        touchLeft  = sides.includes('left');
        touchRight = sides.includes('right');
    }

    gameContainer.addEventListener('touchstart', (e) => {
        if(gameState !== 'playing' || isPaused) return;
        if(e.target.id === 'pauseBtnUI') return;
        e.preventDefault();
        const rect = gameContainer.getBoundingClientRect();
        for (const t of e.changedTouches) {
            const localX = t.clientX - rect.left;
            const side = localX < CANVAS_WIDTH / 2 ? 'left' : 'right';
            activeTouches.set(t.identifier, side);
        }
        syncTouchSides();
    }, { passive: false });

    function endTouches(e) {
        if(e.target.id === 'pauseBtnUI') return;
        e.preventDefault();
        for (const t of e.changedTouches) activeTouches.delete(t.identifier);
        syncTouchSides();
    }
    gameContainer.addEventListener('touchend',    endTouches, { passive: false });
    gameContainer.addEventListener('touchcancel', endTouches, { passive: false });

    // Audio System
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) {
            try { audioCtx = new AudioContext(); } catch(e) { return; }
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        
        if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'superjump' || type === 'item') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'break') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
            gainNode.gain.setValueAtTime(0.5, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        }
    }

    // Classes
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 8 - 2;
            this.life = 1.0;
            this.color = color;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += GRAVITY * 0.5;
            this.life -= 0.03;
        }
        draw() {
            if (this.life <= 0) return;
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y - cameraY, 5, 5);
            ctx.globalAlpha = 1.0;
        }
    }

    function spawnParticles(x, y, color, amount) {
        for(let i=0; i<amount; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    class Player {
        constructor() {
            this.width = 40;
            this.height = 40;
            this.x = CANVAS_WIDTH / 2 - this.width / 2;
            this.y = CANVAS_HEIGHT - 150;
            this.vx = 0;
            this.vy = 0;
            this.color = '#8cc63f';
            this.hasItem = 0; // 0: none, 1: rocket, 2: propeller
            this.itemTimer = 0;
            
            // Animation props
            this.scaleY = 1.0;
            this.rotation = 0;
        }

        update() {
            // Horizontal Movement
            if (keys.ArrowLeft || keys.a || touchLeft) {
                this.vx = -PLAYER_SPEED;
            } else if (keys.ArrowRight || keys.d || touchRight) {
                this.vx = PLAYER_SPEED;
            } else {
                this.vx = 0;
            }

            this.x += this.vx;

            // Screen Wrap
            if (this.x > CANVAS_WIDTH) this.x = -this.width;
            if (this.x + this.width < 0) this.x = CANVAS_WIDTH;

            if (this.hasItem > 0) {
                this.itemTimer--;
                this.vy = (this.hasItem === 1) ? -18 : -12; 
                this.y += this.vy;
                
                // Spin animation for propeller
                if(this.hasItem === 2) {
                    this.rotation += 0.2;
                }
                
                if (this.itemTimer <= 0) {
                    this.hasItem = 0;
                    this.vy = 0; 
                    this.rotation = 0;
                }
            } else {
                // Vertical Movement
                this.vy += GRAVITY;
                this.y += this.vy;
                this.rotation = 0;
            }

            // Restore scale
            if (this.scaleY < 1.0) {
                this.scaleY += 0.05;
                if(this.scaleY > 1.0) this.scaleY = 1.0;
            }
        }

        jump(isSuper = false) {
            this.vy = isSuper ? SUPER_JUMP_VELOCITY : JUMP_VELOCITY;
            this.scaleY = 0.6; // squash
            playSound(isSuper ? 'superjump' : 'jump');
        }

        draw() {
            ctx.save();
            ctx.translate(this.x + this.width/2, this.y - cameraY + this.height);
            ctx.rotate(this.rotation);
            ctx.scale(1, this.scaleY);
            ctx.translate(-(this.x + this.width/2), -(this.y - cameraY + this.height));

            // Body
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.roundRect(this.x, this.y - cameraY, this.width, this.height, 10);
            ctx.fill();

            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(this.x + 12, this.y - cameraY + 12, 6, 0, Math.PI * 2);
            ctx.arc(this.x + 28, this.y - cameraY + 12, 6, 0, Math.PI * 2);
            ctx.fill();

            // Pupils
            ctx.fillStyle = 'black';
            let pupilOffset = (this.vx / PLAYER_SPEED) * 2;
            ctx.beginPath();
            ctx.arc(this.x + 12 + pupilOffset, this.y - cameraY + 12, 2, 0, Math.PI * 2);
            ctx.arc(this.x + 28 + pupilOffset, this.y - cameraY + 12, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Snout
            ctx.beginPath();
            ctx.ellipse(this.x + 20, this.y - cameraY + 25, 4, 8, Math.PI / 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw Item equipped
            if (this.hasItem === 1) {
                // Rocket on back
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(this.x + 10, this.y - cameraY + 10, 20, 30);
                // fire
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(this.x + 10, this.y - cameraY + 40);
                ctx.lineTo(this.x + 20, this.y - cameraY + 55 + Math.random()*10);
                ctx.lineTo(this.x + 30, this.y - cameraY + 40);
                ctx.fill();
            } else if (this.hasItem === 2) {
                // Propeller Hat
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(this.x + 20, this.y - cameraY, 10, 0, Math.PI, true);
                ctx.fill();
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(this.x + 18, this.y - cameraY - 10, 4, 10);
                // propeller blades
                ctx.fillStyle = '#999';
                let bladeWidth = 20 + Math.random()*10;
                ctx.fillRect(this.x + 20 - bladeWidth/2, this.y - cameraY - 12, bladeWidth, 4);
            }
            ctx.restore();
        }
    }

    class Platform {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.width = 60;
            this.height = 15;
            this.type = type;
            this.broken = false;
            this.opacity = 1;

            this.direction = Math.random() > 0.5 ? 1 : -1;
            this.speed = 1 + Math.random() * 2;

            this.hasSpring = (type === PLAT_TYPES.SPRING || (type === PLAT_TYPES.NORMAL && Math.random() < 0.1));
            this.springState = 0;
        }

        update() {
            if (this.type === PLAT_TYPES.MOVING) {
                this.x += this.speed * this.direction;
                if (this.x <= 0 || this.x + this.width >= CANVAS_WIDTH) {
                    this.direction *= -1;
                }
            }

            if (this.broken) {
                this.y += 5; // Fall down
            }

            if (this.type === PLAT_TYPES.DISAPPEAR && this.broken) {
                this.opacity -= 0.1;
            }
        }

        draw() {
            if (this.opacity <= 0) return;
            ctx.globalAlpha = Math.max(0, this.opacity);

            if (this.broken && this.type === PLAT_TYPES.BREAKABLE) {
                // Draw broken brown platform
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.x, this.y - cameraY, this.width/2 - 2, this.height);
                ctx.fillRect(this.x + this.width/2 + 2, this.y - cameraY + 10, this.width/2 - 2, this.height);
            } else {
                switch (this.type) {
                    case PLAT_TYPES.NORMAL:    ctx.fillStyle = '#58c53b'; break; // Green
                    case PLAT_TYPES.MOVING:    ctx.fillStyle = '#3bc5c5'; break; // Blue
                    case PLAT_TYPES.BREAKABLE: ctx.fillStyle = '#c5853b'; break; // Brown
                    case PLAT_TYPES.SPRING:    ctx.fillStyle = '#58c53b'; break; // Green
                    case PLAT_TYPES.DISAPPEAR: ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ccc'; break; // White
                }

                ctx.beginPath();
                ctx.roundRect(this.x, this.y - cameraY, this.width, this.height, 5);
                ctx.fill();
                if (this.type === PLAT_TYPES.DISAPPEAR) ctx.stroke();
            }
            
            // Spring
            if (this.hasSpring && !this.broken) {
                ctx.fillStyle = '#777';
                if (this.springState === 0) {
                    ctx.fillRect(this.x + this.width/2 - 8, this.y - cameraY - 8, 16, 8);
                } else {
                    ctx.fillRect(this.x + this.width/2 - 8, this.y - cameraY - 20, 16, 20);
                }
            }
            ctx.globalAlpha = 1;
        }
    }

    class Enemy {
        constructor(x, y, type) {
            this.x = x;
            this.y = y - 30; // Float slightly above platform
            this.width = 40;
            this.height = 30;
            this.type = type; // 0: Monster, 1: Black Hole
            this.direction = Math.random() > 0.5 ? 1 : -1;
            this.speed = 1 + Math.random();
        }
        update() {
            if (this.type === 0) {
                this.x += this.speed * this.direction;
                if (this.x <= 0 || this.x + this.width >= CANVAS_WIDTH) {
                    this.direction *= -1;
                }
            }
        }
        draw() {
            if (this.type === 0) {
                // Monster
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.roundRect(this.x, this.y - cameraY, this.width, this.height, 5);
                ctx.fill();
                // Teeth/spikes
                ctx.fillStyle = 'white';
                for(let i=0; i<4; i++) {
                    ctx.beginPath();
                    ctx.moveTo(this.x + i*10, this.y - cameraY);
                    ctx.lineTo(this.x + i*10 + 5, this.y - cameraY - 10);
                    ctx.lineTo(this.x + i*10 + 10, this.y - cameraY);
                    ctx.fill();
                }
                // Eyes
                ctx.beginPath();
                ctx.arc(this.x + 10, this.y - cameraY + 15, 4, 0, Math.PI * 2);
                ctx.arc(this.x + 30, this.y - cameraY + 15, 4, 0, Math.PI * 2);
                ctx.fill();
            } else if (this.type === 1) {
                // Black Hole
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x + this.width/2, this.y - cameraY + this.height/2, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = `rgba(100, 0, 200, ${0.5 + Math.sin(Date.now() / 200)*0.5})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(this.x + this.width/2, this.y - cameraY + this.height/2, 25, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    }

    class Item {
        constructor(x, y, type) {
            this.x = x + 20;
            this.y = y - 30; // Sit on platform
            this.width = 20;
            this.height = 30;
            this.type = type; // 1: Rocket, 2: Propeller
            this.collected = false;
        }
        draw() {
            if (this.collected) return;
            if (this.type === 1) {
                // Rocket
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width/2, this.y - cameraY);
                ctx.lineTo(this.x + this.width, this.y - cameraY + this.height);
                ctx.lineTo(this.x, this.y - cameraY + this.height);
                ctx.fill();
            } else if (this.type === 2) {
                // Propeller Hat
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(this.x + this.width/2, this.y - cameraY + this.height, 10, 0, Math.PI, true);
                ctx.fill();
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(this.x + this.width/2 - 2, this.y - cameraY + this.height - 20, 4, 10);
                // propeller blades
                ctx.fillStyle = '#999';
                ctx.fillRect(this.x, this.y - cameraY + this.height - 22, this.width, 4);
            }
        }
    }

    // Core Functions
    function generatePlatforms(startY, amount) {
        let y = startY;
        let platformGap = 60 + Math.min(score / 200, 40);
        
        for (let i = 0; i < amount; i++) {
            y -= platformGap;
            let x = Math.random() * (CANVAS_WIDTH - 60);
            
            let type = PLAT_TYPES.NORMAL;
            let r = Math.random();
            let difficulty = Math.min(score / 10000, 1);

            if (y > -500) {
                type = PLAT_TYPES.NORMAL; // Safe start
            } else {
                if (r < 0.1 + difficulty * 0.1) type = PLAT_TYPES.BREAKABLE;
                else if (r < 0.2 + difficulty * 0.2) type = PLAT_TYPES.MOVING;
                else if (r < 0.25 + difficulty * 0.2) type = PLAT_TYPES.DISAPPEAR;
                else if (r < 0.3) type = PLAT_TYPES.SPRING;
            }

            let platform = new Platform(x, y, type);
            platforms.push(platform);
            highestY = y;

            // Generate enemies and items on normal or moving platforms
            if (y < -1000 && (type === PLAT_TYPES.NORMAL || type === PLAT_TYPES.MOVING) && !platform.hasSpring) {
                let spawnR = Math.random();
                if (spawnR < 0.05 + difficulty * 0.05) {
                    // Spawn Enemy
                    enemies.push(new Enemy(x, y, Math.random() > 0.7 ? 1 : 0));
                } else if (spawnR > 0.95) {
                    // Spawn Item
                    items.push(new Item(x, y, Math.random() > 0.5 ? 1 : 2));
                }
            }
        }
    }

    function togglePause() {
        if (gameState === 'playing') {
            isPaused = !isPaused;
            if (!isPaused) {
                pauseScreen.classList.remove('active');
                cancelAnimationFrame(animationId);
                animationId = requestAnimationFrame(gameLoop);
            } else {
                pauseScreen.classList.add('active');
            }
        }
    }

    function startGame() {
        if (!audioCtx) {
            try { audioCtx = new AudioContext(); } catch(e) {}
        }
        
        gameState = 'playing';
        isPaused = false;
        menuScreen.classList.remove('active');
        gameOverScreen.classList.remove('active');
        pauseScreen.classList.remove('active');
        scoreBoard.style.display = 'block';
        pauseBtnUI.style.display = 'block';
        
        score = 0;
        cameraY = 0;
        platforms = [];
        enemies = [];
        items = [];
        particles = [];
        highestY = CANVAS_HEIGHT;
        currentScoreEl.innerText = score;
        
        player = new Player();
        
        // Base platform
        platforms.push(new Platform(CANVAS_WIDTH / 2 - 30, CANVAS_HEIGHT - 50, PLAT_TYPES.NORMAL));
        
        generatePlatforms(CANVAS_HEIGHT, Math.ceil(CANVAS_HEIGHT / 60) + 5);
        
        cancelAnimationFrame(animationId);
        gameLoop();
    }

    function gameOver() {
        if(gameState === 'gameover') return;
        gameState = 'gameover';
        shakeTime = 20;
        spawnParticles(player.x + player.width/2, player.y + player.height/2, '#8cc63f', 30);
        
        playSound('gameover');
        scoreBoard.style.display = 'none';
        pauseBtnUI.style.display = 'none';
        gameOverScreen.classList.add('active');
        finalScoreEl.innerText = score;
        
        const isRecord = score > 0 && (leaderBoard.length === 0 || score > leaderBoard[0]);
        leaderBoard.push(score);
        leaderBoard.sort((a,b) => b-a);
        leaderBoard = leaderBoard.slice(0, 5);
        try { localStorage.setItem('doodle_leaderboard', JSON.stringify(leaderBoard)); } catch {}
        renderLeaderboard();

        // Remove any prior "NEW BEST" tag, then add a fresh one if this run set a record
        const oldTag = gameOverScreen.querySelector('.new-best');
        if (oldTag) oldTag.remove();
        if (isRecord) {
            const tag = document.createElement('div');
            tag.className = 'new-best';
            tag.textContent = '🎉 NEW BEST';
            tag.style.cssText = 'color:#e67e22;font-weight:bold;margin:8px 0;font-size:20px;';
            const h3 = gameOverScreen.querySelector('h3');
            gameOverScreen.insertBefore(tag, h3);
        }
    }

    function isColliding(a, b) {
        return a.x < b.x + b.width &&
               a.x + a.width > b.x &&
               a.y < b.y + b.height &&
               a.y + a.height > b.y;
    }

    function update() {
        if (gameState !== 'playing' || isPaused) return;

        player.update();

        // Camera Follow
        let targetCameraY = player.y - CANVAS_HEIGHT / 2;
        if (targetCameraY < cameraY) {
            cameraY = targetCameraY;
            let newScore = Math.floor(Math.abs(cameraY));
            if (newScore > score) {
                score = newScore;
                currentScoreEl.innerText = score;
            }
        }

        // Generate more platforms
        if (highestY > cameraY - CANVAS_HEIGHT) {
            generatePlatforms(highestY, 10);
        }

        // Particles
        for(let i=particles.length-1; i>=0; i--) {
            particles[i].update();
            if(particles[i].life <= 0) particles.splice(i, 1);
        }

        // Items logic
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            if (!item.collected && isColliding(player, item)) {
                item.collected = true;
                player.hasItem = item.type;
                player.itemTimer = (item.type === 1) ? 120 : 180; // Rocket lasts less than propeller
                playSound('item');
                spawnParticles(item.x+10, item.y+15, '#ffcc00', 10);
            }
            if (item.y > cameraY + CANVAS_HEIGHT + 100) items.splice(i, 1);
        }

        // Enemies logic
        for (let i = enemies.length - 1; i >= 0; i--) {
            let enemy = enemies[i];
            enemy.update();
            
            // Only collide with enemies if player doesn't have an item boosting them up
            if (player.hasItem === 0) {
                if (isColliding(player, enemy)) {
                    // Check if player jumps ON the monster (not black hole)
                    if (enemy.type === 0 && player.vy > 0 && player.y + player.height < enemy.y + enemy.height / 2) {
                        enemies.splice(i, 1); // Kill enemy
                        player.jump(); // Bounce off
                        playSound('hit');
                        spawnParticles(enemy.x+20, enemy.y+15, '#ff4444', 20);
                        shakeTime = 5;
                    } else {
                        // Only kill on meaningful vertical overlap — grazing the top doesn't count
                        if (player.y + player.height > enemy.y + 4) gameOver();
                    }
                }
            } else {
                // If player is boosting with an item and hits a monster, kill the monster
                if (enemy.type === 0 && isColliding(player, enemy)) {
                    enemies.splice(i, 1);
                    playSound('hit');
                    spawnParticles(enemy.x+20, enemy.y+15, '#ff4444', 20);
                }
            }

            if (enemy.y > cameraY + CANVAS_HEIGHT + 100) enemies.splice(i, 1);
        }

        // Platform Updates & Collisions
        for (let i = 0; i < platforms.length; i++) {
            let p = platforms[i];
            p.update();

            // Collision (Only when falling and no active item flying up)
            if (player.vy > 0 && player.hasItem === 0) {
                if (player.x + player.width > p.x && player.x < p.x + p.width) {
                    let playerBottom = player.y + player.height;
                    let prevPlayerBottom = playerBottom - player.vy;
                    
                    if (prevPlayerBottom <= p.y + 10 && playerBottom >= p.y && !p.broken && p.opacity > 0) {
                        if (p.type === PLAT_TYPES.BREAKABLE) {
                            p.broken = true;
                            playSound('break');
                            spawnParticles(p.x+30, p.y, '#8B4513', 15);
                            shakeTime = 8;
                        } else if (p.type === PLAT_TYPES.DISAPPEAR) {
                            p.broken = true;
                            player.jump();
                            spawnParticles(p.x+30, p.y, '#ffffff', 10);
                        } else {
                            if (p.hasSpring && player.x + player.width/2 > p.x + p.width/2 - 10 && player.x + player.width/2 < p.x + p.width/2 + 10) {
                                p.springState = 1;
                                player.jump(true);
                            } else {
                                player.jump();
                            }
                        }
                    }
                }
            }
        }

        // Remove off-screen platforms
        platforms = platforms.filter(p => p.y < cameraY + CANVAS_HEIGHT + 100);

        // Death condition
        if (player.y > cameraY + CANVAS_HEIGHT) {
            gameOver();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Screen Shake
        ctx.save();
        if (shakeTime > 0 && !isPaused) {
            ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
            shakeTime--;
        }

        // Grid parallax background logic is handled via CSS linear gradient,
        // but to make it scroll we update the background-position of the container.
        gameContainer.style.backgroundPosition = `0px ${-cameraY % 20}px`;

        for (let p of platforms) p.draw();
        for (let i of items) i.draw();
        for (let e of enemies) e.draw();
        for (let part of particles) part.draw();

        if (player && gameState !== 'gameover') {
            player.draw();
        }
        
        ctx.restore(); // Restore shake
    }

    function gameLoop() {
        if (isPaused) return; // genuinely stop the loop while paused

        update();
        draw();

        if (gameState === 'gameover') {
            // allow particles to finish rendering on game over
            for(let i=particles.length-1; i>=0; i--) {
                particles[i].update();
                if(particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        if (gameState === 'playing' || (gameState === 'gameover' && particles.length > 0)) {
            animationId = requestAnimationFrame(gameLoop);
        }
    }

    // Button Events
    document.getElementById('playBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
    document.getElementById('menuBtn').addEventListener('click', () => {
        gameState = 'menu';
        gameOverScreen.classList.remove('active');
        pauseScreen.classList.remove('active');
        menuScreen.classList.add('active');
    });
    document.getElementById('pauseBtnUI').addEventListener('click', togglePause);
    document.getElementById('resumeBtn').addEventListener('click', togglePause);
    document.getElementById('quitBtn').addEventListener('click', () => {
        isPaused = false;
        gameState = 'menu';
        pauseScreen.classList.remove('active');
        scoreBoard.style.display = 'none';
        pauseBtnUI.style.display = 'none';
        menuScreen.classList.add('active');
    });

    // Initial background rendering
    draw();

</script>
</body>
</html>
